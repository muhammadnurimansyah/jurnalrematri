<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Rematri Sehat - Bebas Anemia</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    
    <!-- Dukungan Khusus Apple / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="RematriSehat">
    <link rel="apple-touch-icon" href="favicon.ico">

    <meta name="theme-color" content="#ff6b8b">
    <style>
        :root {
            --pink-primary: #ff6b8b;
            --pink-light: #fff0f3;
            --text-dark: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--pink-light);
            color: var(--text-dark);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 {
            color: var(--pink-primary);
            font-size: 24px;
            text-align: center;
            margin-bottom: 5px;
            margin-top: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .setup-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px dashed var(--pink-primary);
        }
        .setup-box label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .setup-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #ffffff;
        }
        /* Style Banner Instalasi */
        .install-banner {
            display: none;
            background: #ffeaa7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid #fdcb6e;
        }
        .install-banner-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-install-app {
            background: #0984e3;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        .btn-close-banner {
            background: transparent;
            color: #2d3436;
            border: 1px solid #2d3436;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        .card-tips {
            background: #ffe0e6;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid var(--pink-primary);
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .todo-item {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .todo-item input {
            margin-right: 15px;
            transform: scale(1.3);
            accent-color: var(--pink-primary);
        }
        .todo-item span {
            font-size: 14px;
            font-weight: 500;
        }
        .stats-box {
            text-align: center;
            background: var(--pink-primary);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .stats-count {
            font-size: 28px;
            font-weight: bold;
        }
        .btn-submit {
            width: 100%;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn-submit:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        .btn-notif {
            width: 100%;
            background: #2d3436;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            transition: 0.2s;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌸 Rematri Sehat</h1>
    <div class="subtitle">Jurnal Kebiasaan Makan Cegah Anemia</div>

    <!-- Banner Instalasi PWA -->
    <div class="install-banner" id="installBanner">
        <span id="installText"></span>
        <div class="install-banner-actions">
            <button class="btn-install-app" id="installBtn" onclick="triggerInstall()">Instal</button>
            <button class="btn-close-banner" onclick="closeInstallBanner()">Tutup</button>
        </div>
    </div>

    <div class="setup-box" id="setupBox">
        <label for="studentName">Masukkan Nama Lengkap & Kelas:</label>
        <input type="text" id="studentName" placeholder="Contoh: Rina - Kelas 10A" oninput="saveIdentity()">
    </div>

    <div class="card-tips">
        <strong>💡 Tips Hari Ini:</strong><br>
        Jangan minum TTD bersama kopi, teh, atau susu ya! Zat di dalamnya mengikat zat besi. Lebih baik minum dengan air putih atau jus jeruk!
    </div>

    <div class="journal-box">
        <h3 style="margin-bottom: 10px; font-size: 16px;">Ceklis Hari Ini:</h3>
        <label class="todo-item">
            <input type="checkbox" id="task1" onchange="updateProgress()">
            <span>Minum 1 Tablet Tambah Darah (TTD)</span>
        </label>
        <label class="todo-item">
            <input type="checkbox" id="task2" onchange="updateProgress()">
            <span>Makan Lauk Hewani (Ayam/Ikan/Telur/Daging)</span>
        </label>
        <label class="todo-item">
            <input type="checkbox" id="task3" onchange="updateProgress()">
            <span>Makan Buah Kaya Vitamin C (Jeruk/Pepaya/Jambu)</span>
        </label>
    </div>

    <div class="stats-box">
        <div class="stats-count" id="streakCount">0</div>
        <div>Hari Berhasil Patuh Minggu Ini</div>
    </div>

    <button id="submitBtn" class="btn-submit" onclick="submitJurnal()">
        🚀 Kirim Laporan Hari Ini
    </button>

    <button id="notiBtn" class="btn-notif" onclick="requestNotification()">
        🔔 Ingatkan Aku Setiap Jam 19.00
    </button>
</div>

<script>
    // 1. Inisialisasi Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Berhasil'))
        .catch(err => console.error('SW Error:', err));
    }

    // 2. Logika Penawaran Add To Home Screen (A2HS)
    const installBanner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');
    const installText = document.getElementById('installText');
    let deferredPrompt;

    // Deteksi jika pengguna sudah membuka via ikon aplikasi
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    // Deteksi perangkat iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (!isStandalone) {
        if (isIOS) {
            // Instruksi Khusus Safari iOS
            installText.innerHTML = "🍎 <strong>Khusus iPhone:</strong> Ketuk ikon <strong>Share (Bagikan)</strong> di bawah layar, lalu pilih <strong>Add to Home Screen</strong>.";
            installBtn.style.display = 'none'; // Sembunyikan tombol eksekusi karena iOS butuh manual
            installBanner.style.display = 'block';
        } else {
            // Chrome Android (Menangkap event instalasi)
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installText.innerHTML = "🤖 <strong>Instal Aplikasi:</strong> Tambahkan ke Home Screen untuk akses cepat dan notifikasi stabil!";
                installBanner.style.display = 'block';
            });
            // Untuk Firefox, fallback akan ditangani saat tombol ditekan
        }
    }

    function triggerInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    installBanner.style.display = 'none';
                }
                deferredPrompt = null;
            });
        } else {
             // Fallback untuk browser (seperti Firefox Android) yang tidak melempar event prompt
             alert("Gunakan menu browser (Titik Tiga di sudut layar) lalu pilih opsi 'Instal Aplikasi' atau 'Tambahkan ke Layar Utama'.");
        }
    }

    function closeInstallBanner() {
        installBanner.style.display = 'none';
    }

    // 3. Logika Utama Jurnal
    function saveIdentity() {
        const name = document.getElementById('studentName').value;
        localStorage.setItem('studentIdentity', name);
    }

    function loadSavedData() {
        const today = new Date().toDateString();
        const savedDate = localStorage.getItem('lastSavedDate');
        const streak = parseInt(localStorage.getItem('streakCount')) || 0;
        
        const savedIdentity = localStorage.getItem('studentIdentity');
        if (savedIdentity) {
            document.getElementById('studentName').value = savedIdentity;
        }

        if (savedDate !== today) {
            document.getElementById('task1').checked = false;
            document.getElementById('task2').checked = false;
            document.getElementById('task3').checked = false;
            localStorage.setItem('task1', 'false');
            localStorage.setItem('task2', 'false');
            localStorage.setItem('task3', 'false');
            localStorage.setItem('isFullDay', 'false');
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "🚀 Kirim Laporan Hari Ini";
            btn.disabled = false;
            btn.style.background = "#2ecc71";
        } else {
            document.getElementById('task1').checked = localStorage.getItem('task1') === 'true';
            document.getElementById('task2').checked = localStorage.getItem('task2') === 'true';
            document.getElementById('task3').checked = localStorage.getItem('task3') === 'true';
        }
        document.getElementById('streakCount').innerText = streak;

        if (localStorage.getItem('notifSubscribed') === 'true') {
            setNotifButtonActive();
        }
    }

    function updateProgress() {
        const today = new Date().toDateString();
        const t1 = document.getElementById('task1').checked;
        const t2 = document.getElementById('task2').checked;
        const t3 = document.getElementById('task3').checked;

        localStorage.setItem('task1', t1);
        localStorage.setItem('task2', t2);
        localStorage.setItem('task3', t3);

        const wasFullBefore = localStorage.getItem('isFullDay') === 'true';
        const isFullNow = t1 && t2 && t3;
        let streak = parseInt(localStorage.getItem('streakCount')) || 0;
        const savedDate = localStorage.getItem('lastSavedDate');

        if (isFullNow && (!wasFullBefore || savedDate !== today)) {
            streak += 1;
            localStorage.setItem('isFullDay', 'true');
        } else if (!isFullNow && wasFullBefore && savedDate === today) {
            streak = Math.max(0, streak - 1);
            localStorage.setItem('isFullDay', 'false');
        }

        localStorage.setItem('lastSavedDate', today);
        localStorage.setItem('streakCount', streak);
        document.getElementById('streakCount').innerText = streak;
    }

    function submitJurnal() {
        const identity = document.getElementById('studentName').value.trim();
        
        if(!identity) {
            alert("Mohon isi Nama & Kelas terlebih dahulu ya!");
            document.getElementById('studentName').focus();
            return;
        }

        const t1 = document.getElementById('task1').checked;
        const t2 = document.getElementById('task2').checked;
        const t3 = document.getElementById('task3').checked;
        const streak = parseInt(localStorage.getItem('streakCount')) || 0;

        const btn = document.getElementById('submitBtn');
        btn.innerText = "⏳ Mengirim...";
        btn.disabled = true;

        kirimKeGoogleSheets(t1, t2, t3, streak);
        
        setTimeout(() => {
            btn.innerText = "✅ Jurnal Berhasil Terkirim!";
            btn.style.background = "#27ae60";
        }, 1500);
    }

    function kirimKeGoogleSheets(t1, t2, t3, streak) {
        const identity = localStorage.getItem('studentIdentity') || 'Tanpa Nama';
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyLFrT6LypIz8mVc1jOG_AXFjap0h8LtV_BzQUwfxozmekgxc8H8tFtjDbrg7knM2a_/exec"; 

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                identitas: identity,
                minumTTD: t1 ? "Ya" : "Tidak",
                laukHewani: t2 ? "Ya" : "Tidak",
                buahVitC: t3 ? "Ya" : "Tidak",
                totalStreak: streak
            })
        }).then(() => {
            console.log("Perintah fetch berhasil dieksekusi");
        }).catch(err => console.log("Gagal kirim cloud:", err));
    }

    // 4. Logika Notifikasi
    function requestNotification() {
        if (!('Notification' in window)) {
            alert('Browser tidak mendukung notifikasi.');
            return;
        }

        Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
                localStorage.setItem('notifSubscribed', 'true');
                setNotifButtonActive();
                if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({ action: 'startReminder' });
                }
            } else {
                alert('Akses ditolak.');
            }
        });
    }

    function setNotifButtonActive() {
        const btn = document.getElementById('notiBtn');
        btn.innerText = "✅ Pengingat Aktif Jam 19.00";
        btn.style.background = "#2ecc71";
        btn.disabled = true;
    }

    window.onload = loadSavedData;
</script>
</body>
</html>
